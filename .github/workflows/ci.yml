name: CI

# 每次 push 都构建，产物直接发到 Release 页的 ci-latest 预发布里。
# 想跳过：commit message 里带 [skip ci] 或 [ci skip]。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PR 一律构建；push 时看 commit message 决定是否跳过
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 SDK 仓库里已经没有 'tools' 包了，action 默认装它会直接失败。
          # 显式指定需要的两个包，并把许可一并接受。
          packages: 'platforms;android-36 build-tools;36.0.0' 

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nnnhook-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 把最新构建覆盖到 ci-latest 这个预发布上，方便手机直接下
      - name: Publish to ci-latest pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=ci-latest
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "CI 构建 ${GITHUB_SHA:0:7}" \
            --notes "自动构建，可能不稳定，仅供测试。

          - 分支：\`${GITHUB_REF_NAME}\`
          - 提交：\`${GITHUB_SHA:0:7}\` $(git log -1 --pretty=%s)
          - 时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
