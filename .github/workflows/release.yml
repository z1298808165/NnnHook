name: Release

# 只有打标签才出正式版：git tag v1.0.0 && git push origin v1.0.0
# 标签不合规（不是 v 开头）不会触发。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v1.0.0）'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 SDK 仓库里已经没有 'tools' 包了，action 默认装它会直接失败。
          # 显式指定需要的两个包，并把许可一并接受。
          packages: 'platforms;android-36 build-tools;36.0.0' 

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 有签名密钥就用，没有就退回 debug 签名（产物照样能装）。
      # 注意：secrets 不能直接写在 if 条件里，只能过 env 再在 shell 里判断。
      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NNNHOOK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "NNNHOOK_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "NNNHOOK_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "NNNHOOK_KEY_PASSWORD=$KS_KEY_PW" >> "$GITHUB_ENV"
            echo "签名密钥已载入"
          else
            echo "未配置签名密钥，将使用 debug 签名"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: art
        run: |
          set -e
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="NnnHook-${GITHUB_REF_NAME#v}.apk"
          cp "$APK" "out/$NAME"
          echo "apk=out/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release create "$TAG" "${{ steps.art.outputs.apk }}" \
            --title "NnnHook $TAG" \
            --generate-notes \
            --latest
